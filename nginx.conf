server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compression: Docusaurus ships plain text assets, never pre-compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Baseline hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP en Report-Only: observa violaciones, no bloquea nada. Sin
    # `report-uri` los informes solo aparecen en la consola del navegador.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;" always;

    # HSTS corto (300 s): si algo falla, el navegador lo olvida en minutos.
    # Subir a 31536000 tras una semana estable.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header no se hereda: este location repite el juego completo.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        try_files $uri =404;
    }

    # Static images and fonts.
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        # add_header no se hereda: este location repite el juego completo.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        try_files $uri =404;
    }

    # Feeds change on every publish: keep the cache short.
    location ~* ^/(rss|atom)\.xml$ {
        add_header Cache-Control "public, max-age=600" always;
        # add_header no se hereda: este location repite el juego completo.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        try_files $uri =404;
    }

    # HTML is revalidated so a new deploy is visible immediately.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # add_header no se hereda: este location repite el juego completo.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;" always;
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
